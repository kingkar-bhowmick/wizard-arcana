services:
  - type: web
    name: wizard-arcana
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: REDIS_URL
        sync: false   # paste a Render Key Value / Upstash Redis URL (optional)
